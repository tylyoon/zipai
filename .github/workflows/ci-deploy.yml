name: Build and deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Test and build Spring Boot application
        run: ./gradlew clean test bootJar --no-daemon

      - name: Verify Docker image build
        run: docker build --tag zipai:${{ github.sha }} .

  publish-and-deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure SSH
        if: env.EC2_HOST != '' && env.EC2_SSH_PRIVATE_KEY != '' && env.EC2_KNOWN_HOSTS != ''
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/zipai_ec2
          chmod 600 ~/.ssh/zipai_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy container to EC2
        if: env.EC2_HOST != '' && env.EC2_SSH_PRIVATE_KEY != '' && env.EC2_KNOWN_HOSTS != ''
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/zipai_ec2 "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/zipai_ec2 "$EC2_USER@$EC2_HOST" \
            "set -e; \
             docker pull '$IMAGE_NAME:latest'; \
             docker rm --force zipai-api 2>/dev/null || true; \
             docker run --detach --name zipai-api --restart unless-stopped \
               --env-file /opt/zipai/.env \
               --publish 127.0.0.1:8080:8080 \
               '$IMAGE_NAME:latest'"

      - name: Explain skipped EC2 deployment
        if: env.EC2_HOST == '' || env.EC2_SSH_PRIVATE_KEY == '' || env.EC2_KNOWN_HOSTS == ''
        run: echo "EC2 GitHub secrets are not configured; image publishing completed without EC2 deployment."
