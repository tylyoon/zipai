<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="지도에서 안전한 집을 찾는 집도소 매물 홈">
  <title>집도소 | 안전한 집 찾기의 시작</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header class="home-header">
    <div class="home-header-inner">
      <a class="home-brand" href="index.html" aria-label="집도소 홈">
        <span class="home-brand-mark" aria-hidden="true">집</span><span>집도소</span>
      </a>
      <nav class="home-main-nav" aria-label="주요 메뉴"> 
        <a class="active" href="index.html">집 매물</a>
        <a href="#safetyMap" data-demo-link>안전위험도</a>
        <a href="sub33.html">사기방지</a>
        <a href="#policy" data-demo-link>금융지원정책</a>
      </nav>
      <div class="home-header-actions">
        <button type="button" class="header-text-button" id="savedHomesButton">찜 <span id="favoriteCount">0</span></button>
        <button type="button" class="header-text-button" data-demo-button>로그인</button>
        <button type="button" class="home-menu-button" aria-label="전체 메뉴" data-demo-button><i></i><i></i><i></i></button>
      </div>
    </div>
  </header>

  <section class="search-toolbar" aria-label="매물 검색 및 필터">
    <form class="location-search" id="locationSearch">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="지역, 지하철역, 학교를 검색해 보세요" aria-label="지역 검색">
      <button type="submit">검색</button>
    </form>
    <div class="quick-filters" id="dealFilters">
      <button type="button" class="filter-chip active" data-deal="all">전체</button>
      <button type="button" class="filter-chip" data-deal="monthly">월세</button>
      <button type="button" class="filter-chip" data-deal="jeonse">전세</button>
      <label class="select-chip"><span>방 유형</span><select id="roomFilter" aria-label="방 유형"><option value="all">전체</option><option value="원룸">원룸</option><option value="1.5룸">1.5룸</option><option value="투룸">투룸</option><option value="쓰리룸">쓰리룸</option></select></label>
      <button type="button" class="filter-chip filter-more" id="openFilterButton"><span class="sliders-icon" aria-hidden="true"></span>상세 필터 <b id="activeFilterCount" hidden>0</b></button>
    </div>
  </section>

  <main class="property-app">
    <aside class="listing-panel" id="listingPanel">
      <div class="listing-heading">
        <div><p id="locationLabel">서울 관악구 주변</p><h1><strong id="listingCount">0</strong>개의 방을 찾았어요</h1></div>
        <label class="sort-select"><span class="sr-only">정렬</span><select id="sortSelect"><option value="recommended">추천순</option><option value="lowMonthly">월세 낮은순</option><option value="lowDeposit">보증금 낮은순</option><option value="largeArea">넓은 면적순</option><option value="safe">안전점수 높은순</option></select></label>
      </div>
      <div class="listing-notice"><span>✓</span><p><strong>집도소 안심 매물</strong>은 기본 권리관계를 먼저 확인했어요.</p><a href="sub33.html">자세히</a></div>
      <div class="property-list" id="propertyList" aria-live="polite"></div>
      <div class="list-loading" id="listLoading" hidden><i></i><span>매물을 찾고 있어요</span></div>
    </aside>

    <section class="map-panel" id="mapPanel" aria-label="매물 지도">
      <div class="map-canvas" id="mapCanvas">
        <svg class="map-art" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="1000" height="720" fill="#f1f1ec"/>
          <path class="map-park" d="M60 80L300 45 355 165 285 265 90 238Z"/><path class="map-park" d="M775 65L965 28 995 190 845 220 750 158Z"/><path class="map-park" d="M490 490L680 460 755 620 605 705 450 630Z"/>
          <path class="map-water" d="M-20 570C155 525 238 555 360 515S610 398 710 425 876 520 1020 470V730H-20Z"/>
          <g class="minor-roads"><path d="M20 130L970 670"/><path d="M-10 330L1000 245"/><path d="M95 -10L560 730"/><path d="M350 -20L890 740"/><path d="M680 -20L230 740"/><path d="M20 460L940 90"/><path d="M0 230L1000 540"/><path d="M220 0L1000 385"/></g>
          <g class="major-roads"><path d="M-30 405C210 420 320 330 500 350S800 460 1030 300"/><path d="M400 -30C430 170 520 250 510 420S430 600 470 750"/><path d="M40 690C250 590 380 570 550 575S800 640 1010 570"/></g>
          <g class="subway-line"><path d="M40 505C210 460 330 435 485 455S760 545 960 430"/></g>
          <g class="station-dots"><circle cx="175" cy="470" r="6"/><circle cx="330" cy="445" r="6"/><circle cx="488" cy="455" r="6"/><circle cx="650" cy="502" r="6"/><circle cx="805" cy="500" r="6"/></g>
          <g class="map-labels"><text x="105" y="155">동작구</text><text x="445" y="190">관악구</text><text x="745" y="165">서초구</text><text x="278" y="395">봉천동</text><text x="552" y="350">낙성대동</text><text x="715" y="405">사당동</text><text x="130" y="630">신림동</text><text class="station-label" x="150" y="495">신림역</text><text class="station-label" x="304" y="470">봉천역</text><text class="station-label" x="458" y="480">서울대입구역</text><text class="station-label" x="620" y="528">낙성대역</text><text class="station-label" x="775" y="526">사당역</text></g>
        </svg>
        <div class="map-grid" aria-hidden="true"></div>
        <div id="mapMarkers" class="map-markers"></div>
      </div>

      <button class="map-search-button" id="searchThisArea" type="button"><span>↻</span> 현 지도에서 검색</button>
      <div class="map-mode-control" role="group" aria-label="지도 유형"><button type="button" class="active" data-map-mode="normal">지도</button><button type="button" data-map-mode="district">동네</button><button type="button" data-map-mode="safe">안전도</button></div>
      <div class="map-zoom-control"><button type="button" id="zoomIn" aria-label="지도 확대">＋</button><button type="button" id="zoomOut" aria-label="지도 축소">−</button></div>
      <button type="button" class="my-location-button" id="myLocation" aria-label="내 위치로 이동"><span></span></button>
      <a class="safety-floating-card" href="sub33.html"><span class="safety-shield">✓</span><div><strong>이 집, 계약해도 괜찮을까?</strong><small>체크리스트로 안전 진단하기 →</small></div></a>

      <aside class="property-detail" id="propertyDetail" aria-hidden="true">
        <button type="button" class="detail-close" id="detailClose" aria-label="상세 닫기">×</button>
        <div id="detailContent"></div>
      </aside>
    </section>
  </main>

  <div class="mobile-view-switch" role="group" aria-label="보기 방식"><button type="button" class="active" data-view="list"><span>☷</span> 목록</button><button type="button" data-view="map"><span>⌖</span> 지도</button></div>

  <div class="sheet-backdrop" id="filterSheet" aria-hidden="true">
    <section class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
      <header><h2 id="filterTitle">상세 필터</h2><button type="button" class="sheet-close" aria-label="닫기">×</button></header>
      <div class="filter-sheet-body">
        <fieldset><legend>월세 한도</legend><div class="range-value"><strong id="monthlyValue">제한 없음</strong></div><input type="range" id="monthlyRange" min="30" max="150" step="10" value="150"><div class="range-labels"><span>30만원</span><span>150만원 이상</span></div></fieldset>
        <fieldset><legend>보증금 한도</legend><div class="range-value"><strong id="depositValue">제한 없음</strong></div><input type="range" id="depositRange" min="500" max="30000" step="500" value="30000"><div class="range-labels"><span>500만원</span><span>3억원 이상</span></div></fieldset>
        <fieldset><legend>필수 옵션</legend><div class="option-checks"><label><input type="checkbox" id="parkingFilter"><span>주차 가능</span></label><label><input type="checkbox" id="elevatorFilter"><span>엘리베이터</span></label><label><input type="checkbox" id="petFilter"><span>반려동물</span></label><label><input type="checkbox" id="safeFilter"><span>안심 매물만</span></label></div></fieldset>
      </div>
      <footer><button type="button" class="reset-filter" id="resetFilters">초기화</button><button type="button" class="apply-filter" id="applyFilters"><span id="sheetResultCount">0</span>개 매물 보기</button></footer>
    </section>
  </div>

  <div class="sheet-backdrop" id="inquiryModal" aria-hidden="true">
    <section class="inquiry-modal" role="dialog" aria-modal="true" aria-labelledby="inquiryTitle">
      <button type="button" class="sheet-close inquiry-close" aria-label="닫기">×</button><span class="inquiry-icon">집</span><h2 id="inquiryTitle">방문 상담을 신청할까요?</h2><p id="inquiryPropertyName">선택한 매물</p><label>연락받을 휴대폰 번호<input type="tel" id="phoneInput" placeholder="010-0000-0000" maxlength="13"></label><small>데모 화면으로 실제 상담이 접수되지는 않습니다.</small><button type="button" class="apply-filter" id="submitInquiry">상담 신청하기</button>
    </section>
  </div>

  <div class="home-toast" id="homeToast" role="status" aria-live="polite"></div>
  <script src="home.js"></script>
</body>
</html>
