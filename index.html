<body>
       <div class="zipai-header" role="banner">
    <div class="header-utility">
      <div class="common-container utility-inner">
        <div class="utility-message">
          <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          <span>안심할 수 있는 부동산 거래, ZipAI가 함께합니다.</span>

        <div class="utility-links">
          <a href="#">공지사항</a>

    <div class="header-main">

          <span class="header-logo-copy"><strong>ZipAI</strong><small>집을 아는 가장 쉬운 방법</small></span>
        </a>

        <button class="mobile-menu-button" type="button" aria-label="전체 메뉴 열기" aria-expanded="false" aria-controls="primaryMenu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <div class="header-menu" id="primaryMenu" role="navigation" aria-label="주요 메뉴">

            <button class="icon-button" type="button" aria-label="검색">

            <a class="login-button" href="#">

  <div class="header-preview">
    <div class="common-container preview-inner">
      <span>ZIPAI UI COMPONENT</span>
      <h1>좋은 집을 찾는 첫걸음</h1>
      <p>안전한 매물 탐색부터 계약 준비까지 한곳에서 확인하세요.</p>
    </div>
  </div>

  <script>
    const menuButton = document.querySelector('.mobile-menu-button');
    const headerMenu = document.querySelector('.header-menu');

    menuButton.addEventListener('click', () => {
      const isOpen = headerMenu.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? '전체 메뉴 닫기' : '전체 메뉴 열기');
      menuButton.querySelector('i').className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    });
  </script>
