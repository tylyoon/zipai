<!-- html 구조 생성 -->
<!-- !+Tap -->
<!DOCTYPE html>
<html lang="ko">
<!-- 메타데이터 = 데이터를 설명하는 데이터 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!-- 자식 노드 생성 -->
<!-- div>ul>li+Tab -->
<body>
    <div>
        <ul>
            <li></li>
        </ul>
    </div>
    
<!-- 형제 노드 생성 -->
<!-- div+p+span+Tab -->
    <div></div>
    <p></p>
    <span></span>

<!-- 반복 생성 -->
<!-- ul>li*3+Tab -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

<!-- 클래스(.)와 아이디(#) 지정 -->
<!-- div#main+Tab(아이디), .item*2+Tab(클래스) -->
    <div id="main"></div>
    <div class="item"></div>
    <div class="item"></div>

<!-- 텍스트 입력:/ 넘버링링:$ -->
<!-- ul>li.list-$*3{메뉴 $}+Tab -->
    <ul>
        <li class="list-1">메뉴 1</li>
        <li class="list-2">메뉴 2</li>
        <li class="list-3">메뉴 3</li>
    </ul>

<!-- div>div>img+div>h3+p -->
     <div>
        <div>
            <img src="" alt="">
            <div>
                <h3></h3>
                <p></p>
            </div>
        </div>
     </div>
</body>
</html>
