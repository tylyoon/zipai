<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>청년주거 안전도 분석</title>

    <!-- Bootstrap5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Noto Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet"
          href="/static/css/safety.css">

</head>

<body>

<header class="shadow-sm bg-white">

<div class="container-fluid">

<div class="row align-items-center py-3">

<div class="col-lg-3">

<h1 class="logo">

HomePick Safety

</h1>

</div>


<div class="col-lg-6">

<form class="search-box">

<div class="input-group">

<label class="visually-hidden" for="address">
주소 검색
</label>

<input
id="address"
type="text"
class="form-control form-control-lg"
placeholder="주소를 입력하세요">

<button
class="btn btn-primary">

검색

</button>

</div>

</form>

</div>


<div class="col-lg-3 text-end">

<button class="btn btn-outline-primary">

내 위치

</button>

</div>

</div>

</div>

</header>



<main>

<div class="container-fluid mt-4">

<div class="row">


<!-- 왼쪽 -->

<aside class="col-xl-3">



<section class="card shadow border-0 mb-4">

<div class="card-body">

<h2>

안전도 분석

</h2>

<div class="score-circle">

89

</div>

<h3 class="safe">

매우 안전

</h3>

<hr>

<div class="d-flex justify-content-between">

<span>범죄주의구간</span>

<span>93점</span>

</div>

<div class="progress mb-3">

<div class="progress-bar"
style="width:93%">

</div>

</div>

<div class="d-flex justify-content-between">

<span>여성 밤길</span>

<span>87점</span>

</div>

<div class="progress mb-3">

<div class="progress-bar"
style="width:87%">

</div>

</div>

<div class="d-flex justify-content-between">

<span>CCTV</span>

<span>95점</span>

</div>

<div class="progress mb-3">

<div class="progress-bar"
style="width:95%">

</div>

</div>

<div class="d-flex justify-content-between">

<span>비상벨</span>

<span>90점</span>

</div>

<div class="progress mb-3">

<div class="progress-bar"
style="width:90%">

</div>

</div>

<div class="d-flex justify-content-between">

<span>치안시설</span>

<span>92점</span>

</div>

<div class="progress">

<div class="progress-bar"
style="width:92%">

</div>

</div>

</div>

</section>




<section class="card shadow border-0">

<div class="card-body">

<h2>

지도 필터

</h2>

<div class="form-check form-switch">

<input
checked
class="form-check-input"
type="checkbox">

<label>

범죄주의구간

</label>

</div>


<div class="form-check form-switch">

<input
checked
class="form-check-input"
type="checkbox">

<label>

여성 밤길 치안

</label>

</div>

<div class="form-check form-switch">

<input
checked
class="form-check-input"
type="checkbox">

<label>

CCTV

</label>

</div>

<div class="form-check form-switch">

<input
checked
class="form-check-input"
type="checkbox">

<label>

비상벨

</label>

</div>

<div class="form-check form-switch">

<input
checked
class="form-check-input"
type="checkbox">

<label>

치안시설

</label>

</div>

</div>

</section>

</aside>





<section class="col-xl-9">

<div class="card shadow border-0">

<div class="card-body">

<h2>

안전지도

</h2>

<div id="map">

지도 API 영역

</div>

</div>

</div>


<div class="row mt-4">

<div class="col-lg-4">

<div class="card stat-card">

<div class="card-body">

<h4>

범죄주의구간

</h4>

<h2>

5곳

</h2>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card stat-card">

<div class="card-body">

<h4>

CCTV

</h4>

<h2>

128개

</h2>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card stat-card">

<div class="card-body">

<h4>

비상벨

</h4>

<h2>

23개

</h2>

</div>

</div>

</div>

</div>



<div class="card shadow border-0 mt-4">

<div class="card-body">

<h2>

AI 안전 분석

</h2>

<ul>

<li>

야간 범죄 발생률이 평균보다 낮습니다.

</li>

<li>

여성안심귀갓길이 가까이 있습니다.

</li>

<li>

CCTV 밀집도가 높습니다.

</li>

<li>

경찰서 접근성이 우수합니다.

</li>

<li>

전반적으로 매우 안전한 지역입니다.

</li>

</ul>

</div>

</div>

</section>

</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="/static/js/safety.js"></script>

</body>

</html>
